services:
  postgres:
    image: postgres:16-alpine
    container_name: ai_accounting_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ai_accounting_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ai_accounting_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: ai_accounting_backend
    restart: unless-stopped
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/ai_accounting_dev
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET_KEY=dev_secret_key_change_in_production_min_32_chars
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/backend:/app

  ai-service:
    build:
      context: ./apps/ai-service
      dockerfile: Dockerfile
    container_name: ai_accounting_ai_service
    restart: unless-stopped
    environment:
      - ENVIRONMENT=development
      - BACKEND_API_URL=http://backend:8000/api/v1
    ports:
      - "8001:8001"
    volumes:
      - ./apps/ai-service:/app

  web-frontend:
    build:
      context: ./apps/web-frontend
      dockerfile: Dockerfile
    container_name: ai_accounting_frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=development
      - BACKEND_INTERNAL_URL=http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
