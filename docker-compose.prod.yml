services:
  postgres:
    image: postgres:16-alpine
    container_name: fundsafe_postgres_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-fundsafe_erp_prod}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fundsafe_internal

  redis:
    image: redis:7-alpine
    container_name: fundsafe_redis_prod
    restart: always
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fundsafe_internal

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: fundsafe_backend_prod
    restart: always
    environment:
      - ENVIRONMENT=production
      - PROJECT_NAME=FundSafe ERP
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-fundsafe_erp_prod}
      - DATABASE_SYNC_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-fundsafe_erp_prod}
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - BACKEND_CORS_ORIGINS=${CORS_ORIGINS:-http://localhost,http://localhost:3000,https://app.fundsafe.in}
      - SENTRY_DSN=${SENTRY_DSN:-}
      - SENTRY_ENVIRONMENT=production
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-}
      - WHATSAPP_API_KEY=${WHATSAPP_API_KEY:-}
      - WHATSAPP_PHONE_NUMBER_ID=${WHATSAPP_PHONE_NUMBER_ID:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - fundsafe_internal

  ai-service:
    build:
      context: ./apps/ai-service
      dockerfile: Dockerfile
    container_name: fundsafe_ai_prod
    restart: always
    environment:
      - ENVIRONMENT=production
      - BACKEND_API_URL=http://backend:8000/api/v1
    depends_on:
      - backend
    networks:
      - fundsafe_internal

  web-frontend:
    build:
      context: ./apps/web-frontend
      dockerfile: Dockerfile
    container_name: fundsafe_frontend_prod
    restart: always
    environment:
      - NODE_ENV=production
      - BACKEND_INTERNAL_URL=http://backend:8000
    depends_on:
      - backend
    networks:
      - fundsafe_internal

  nginx:
    image: nginx:alpine
    container_name: fundsafe_nginx_prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - web-frontend
    networks:
      - fundsafe_internal

networks:
  fundsafe_internal:
    driver: bridge

volumes:
  postgres_prod_data:
  redis_prod_data:
